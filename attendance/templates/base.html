<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BMS Admin Panel{% endblock %}</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --background: #0F172A;
            --surface: rgba(30, 41, 59, 0.9);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
        }
        /* Sidebar */
        .sidebar {
            width: 250px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--primary);
        }
        .nav-link {
            padding: 1rem 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            border-bottom: 1px solid var(--border);
            display: block;
        }
        .nav-link:hover {
            background: rgba(255,255,255,0.05);
            color: white;
        }
        /* Main Content */
        .main-content {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 1.5rem;
        }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { background: var(--primary-hover); }
        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        .table th, .table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .table th { color: var(--text-muted); }
    </style>
</head>
<body>
    {% if user.is_authenticated %}
    <div class="sidebar">
        <div class="sidebar-header">BMS Admin</div>
        <a href="{% url 'panel_dashboard' %}" class="nav-link">📊 Dashboard</a>
        
        <div style="padding: 1rem 1.5rem 0.5rem 1.5rem; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600;">Data Management</div>
        <a href="/admin/attendance/registeredemployee/" class="nav-link" style="padding-left: 2rem;">👥 Employees</a>
        <a href="/admin/attendance/warehousedetail/" class="nav-link" style="padding-left: 2rem;">🏢 Warehouses</a>
        <a href="/admin/attendance/employeeattendanceapp/" class="nav-link" style="padding-left: 2rem;">⏱️ Attendance Records</a>
        <a href="/admin/attendance/attendanceverificationattempt/" class="nav-link" style="padding-left: 2rem;">🛡️ Verification Logs</a>
        
        <div style="padding: 1rem 1.5rem 0.5rem 1.5rem; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600;">System</div>
        <a href="/admin/" class="nav-link" style="padding-left: 2rem;">⚙️ Advanced Admin</a>
        
        <a href="{% url 'panel_logout' %}" class="nav-link" style="margin-top: auto; color: #EF4444;">🚪 Logout</a>
    </div>
    {% endif %}

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
